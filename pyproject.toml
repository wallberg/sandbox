[project]
name = "sandbox"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "bitarray",
    "gmpy2",
    "more-itertools",
    "networkx",
    "numpy",
    "ordered-set",
    "pycodestyle",
    "python-constraint",
    "sortedcontainers",
]

[project.scripts]
sandbox-runtests = "sandbox.runtests:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandbox"]
